[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-reasoning-lab"
version = "0.1.0"
description = "A research and engineering laboratory for reliable, verifiable multi-agent AI systems."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "mr-aki"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
arlab = "arlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
